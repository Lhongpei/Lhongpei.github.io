<script>
(function () {
  'use strict';
  var phrases = [
    'Large-Scale Optimization',
    'GPU-Accelerated Algorithms',
    'LLM Systems',
    'AI for Optimization'
  ];

  function start() {
    var el = document.querySelector('[data-bio-typewriter]');
    if (!el || el.dataset.typedAttached) return;
    el.dataset.typedAttached = '1';

    var line = el.closest('.bio-tagline');
    var cursor = line.querySelector('.bio-tagline-cursor');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    var phrase = 0;
    var count = phrases[0].length;
    var deleting = true;
    var visible = true;
    var timer;

    function running() { return visible && !document.hidden && !reduced.matches; }
    function queue(delay) {
      if (running()) timer = window.setTimeout(tick, delay);
    }
    function tick() {
      if (!running()) return;
      var full = phrases[phrase];
      count += deleting ? -1 : 1;
      el.textContent = full.slice(0, count);
      if (!deleting && count === full.length) {
        deleting = true;
        queue(1700);
      } else if (deleting && count === 0) {
        deleting = false;
        phrase = (phrase + 1) % phrases.length;
        queue(250);
      } else {
        queue(deleting ? 40 : 80);
      }
    }
    function update() {
      window.clearTimeout(timer);
      if (reduced.matches) {
        phrase = 0;
        count = phrases[0].length;
        deleting = true;
        el.textContent = phrases[0];
      }
      cursor.hidden = reduced.matches;
      line.classList.toggle('is-typing', running());
      queue(1700);
    }

    // Keep the full fallback phrase for screen readers and without JavaScript.
    // The animated span is aria-hidden, so keystrokes are never announced.
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        visible = entries[0].isIntersecting;
        update();
      }).observe(line);
    }
    document.addEventListener('visibilitychange', update);
    reduced.addEventListener('change', update);
    window.addEventListener('pagehide', function () { window.clearTimeout(timer); });
    window.addEventListener('pageshow', update);
    update();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
