<script>
(function () {
  function applyMetadata(data) {
    var repositories = data && data.repositories;
    if (!repositories) return;

    document.querySelectorAll('.sw-stars[data-repo], .sw-ver[data-repo]').forEach(function (el) {
      var metadata = repositories[el.getAttribute('data-repo')];
      if (!metadata) return;

      if (el.classList.contains('sw-stars') && Number.isInteger(metadata.stars)) {
        el.textContent = metadata.stars;
      } else if (el.classList.contains('sw-ver') && metadata.release) {
        el.textContent = metadata.release;
      }
    });
  }

  function load() {
    fetch('{{ "github-software.json" | relURL }}?v={{ now.Unix }}', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('software metadata request failed');
        return response.json();
      })
      .then(applyMetadata)
      .catch(function () { /* keep the values embedded in the page */ });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', load);
  } else {
    load();
  }
})();
</script>
