<p class="experience-dates"><time datetime="{{ .date_start }}">{{ time.Format "Jan 2006" .date_start }}</time><span aria-hidden="true">—</span>{{ if .date_end }}<time datetime="{{ .date_end }}">{{ time.Format "Jan 2006" .date_end }}</time>{{ else }}<span class="experience-present">Present</span>{{ end }}</p>
