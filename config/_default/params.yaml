# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: emerald

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: "Hongpei Li is a first-year PhD student at Northwestern IEMS researching GPU-accelerated algorithms, large-scale optimization, and AI systems."
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: "Hongpei Li"

# Site footer
footer:
  text: "[Email](mailto:ishongpeili@gmail.com) · [GitHub](https://github.com/Lhongpei) · [Google Scholar](https://scholar.google.com/citations?user=ZXiUF98AAAAJ)"
  copyright:
    notice: ''
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
  comment:
    provider: giscus
    giscus:
      repo: "Lhongpei/Lhongpei.github.io"
      repo_id: "R_kgDONKAqgA"
      category: "Announcements"
      category_id: "DIC_kwDONKAqgM4CrkxJ"
      theme: preferred_color_scheme
      language_code: en  # or zh-CN for Chinese
      mapping: pathname
      reactions_enabled: true
      emit_metadata: false
      input_position: top
      lazy_loading: true
      strict: false

customCSS:
  - css/custom.css
